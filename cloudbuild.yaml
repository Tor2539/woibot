steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - -t
      - asia-southeast1-docker.pkg.dev/woibot/woibot/web:v1
      - -t
      - asia-southeast1-docker.pkg.dev/woibot/woibot/web:latest
      - .
images:
  - asia-southeast1-docker.pkg.dev/woibot/woibot/web:v1
  - asia-southeast1-docker.pkg.dev/woibot/woibot/web:latest
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
