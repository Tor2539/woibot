[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
autorestart=true
priority=10

[program:fluxbox]
command=fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=20

[program:x11vnc]
command=x11vnc -display :99 -nopw -forever -shared -noxdamage -repeat -rfbport 5900
autorestart=true
priority=30

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=40

[program:chromium]
command=/usr/lib/chromium/chromium --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --no-default-browser-check --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --window-position=0,0 --window-size=1680,900 --start-maximized --user-data-dir=/home/woibot/.config/chromium file:///opt/start.html
environment=DISPLAY=":99",HOME="/home/woibot"
user=woibot
autorestart=true
startsecs=5
priority=50
