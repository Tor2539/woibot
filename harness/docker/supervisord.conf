[supervisord]
nodaemon=true

[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24
autorestart=true

[program:fluxbox]
command=fluxbox -display :99
autorestart=true

[program:x11vnc]
command=x11vnc -display :99 -nopw -listen localhost -xkb -ncache 10 -ncache_cr -forever
autorestart=true

[program:novnc]
command=/usr/share/novnc/utils/launch.sh --vnc localhost:5900 --listen 6080
autorestart=true

[program:chromium]
command=chromium-browser --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/home/woibot/.config/chromium --display=:99 about:blank
autorestart=true
user=woibot
environment=DISPLAY=":99"

