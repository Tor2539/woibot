[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
autorestart=true
priority=10

[program:fluxbox]
command=fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=20

[program:x11vnc]
command=x11vnc -display :99 -nopw -forever -shared -rfbport 5900
autorestart=true
priority=30

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=40

[program:chromium]
command=chromium --no-sandbox --disable-dev-shm-usage --remote-debugging-address=0.0.0.0 --remote-debugging-port=9222 --user-data-dir=/home/woibot/.config/chromium about:blank
environment=DISPLAY=":99"
user=woibot
autorestart=true
priority=50
